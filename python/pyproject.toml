[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qvf-writer"
version = "0.7.0rc1"
description = "Standalone reference writer/reader for the QVF (Quantum Visualization Format) quantum-chemistry container"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "vibe-qc authors", email = "mpei@vibe-qc.com" }]
keywords = ["quantum-chemistry", "qvf", "file-format", "wavefunction", "spectra"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = []

[project.optional-dependencies]
numpy = ["numpy>=1.20"]
# Full JSON-Schema structural validation (semantic checks always run without it).
validate = ["jsonschema>=4"]
# The PySCF adapter, qvf.adapters.pyscf (checked against PySCF 2.14.0).
pyscf = ["pyscf>=2.14", "numpy>=1.20"]

[project.urls]
Homepage = "https://vibe-qc.com/docs/qvf/"
Documentation = "https://vibe-qc.com/docs/qvf/"
Source = "https://github.com/vibe-qc/qvf"
Issues = "https://github.com/vibe-qc/qvf/issues"
Changelog = "https://github.com/vibe-qc/qvf/blob/main/CHANGELOG.md"

[project.scripts]
qvf = "qvf.cli:main"
qvf-validate = "qvf.validate:_main_entrypoint"

[tool.setuptools]
py-modules = ["qvf_writer", "qvf_reader", "qvf_units", "qvf_kinds", "qvf_model"]

[tool.setuptools.packages.find]
where = ["."]
include = ["qvf", "qvf.*"]

[tool.setuptools.package-data]
qvf = ["schema/*.json"]
