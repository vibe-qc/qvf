[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "qvf-writer"
version = "0.6.0"
description = "Standalone reference writer/reader for the QVF (Quantum Visualization Format) quantum-chemistry container"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "vibe-qc authors", email = "mpei@vibe-qc.com" }]
keywords = ["quantum-chemistry", "qvf", "file-format", "wavefunction", "spectra"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = []

[project.optional-dependencies]
numpy = ["numpy>=1.20"]
# Full JSON-Schema structural validation (semantic checks always run without it).
validate = ["jsonschema>=4"]

[project.urls]
Homepage = "https://vibe-qc.com/docs/qvf/"
Documentation = "https://vibe-qc.com/docs/qvf/"
Source = "https://github.com/vibe-qc/qvf"

[project.scripts]
qvf = "qvf.cli:main"
qvf-validate = "qvf.validate:_main_entrypoint"

[tool.setuptools]
py-modules = ["qvf_writer", "qvf_reader", "qvf_units", "qvf_kinds", "qvf_model"]
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
where = ["."]
include = ["qvf", "qvf.*"]

[tool.setuptools.package-data]
qvf = ["schema/*.json"]
